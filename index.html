  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPA Ecommerce Test - VWO Historical Segmentation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { background: #222; padding: 15px; color: white; text-align: center; }
    nav a { margin: 10px; cursor: pointer; color: #007bff; text-decoration: underline; }
    .page { display: none; padding: 20px; }
    .active { display: block; }
    .product { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 8px; }
    button { padding: 10px 15px; cursor: pointer; }
    .cart-item { border-bottom: 1px solid #ddd; padding: 10px 0; }
  </style>
</head>
<body>
  <header>
    <h2>SPA Ecommerce Test Page</h2>
    <nav>
      <a onclick="navigate('products')">Products</a>
      <a onclick="navigate('cart')">Cart</a>
      <a onclick="navigate('checkout')">Checkout</a>
    </nav>
  </header>

  <!-- PRODUCT PAGE -->
  <div id="products" class="page active">
    <h2>Products</h2>
    <div class="product">
      <h3>Product A</h3>
      <p>Price: $10</p>
      <button onclick="addToCart('Product A', 10)">Add to Cart</button>
    </div>
    <div class="product">
      <h3>Product B</h3>
      <p>Price: $20</p>
      <button onclick="addToCart('Product B', 20)">Add to Cart</button>
    </div>
    <div class="product">
      <h3>Product C</h3>
      <p>Price: $30</p>
      <button onclick="addToCart('Product C', 30)">Add to Cart</button>
    </div>
  </div>

  <!-- CART PAGE -->
  <div id="cart" class="page">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <h3 id="total"></h3>
    <button onclick="navigate('checkout')">Proceed to Checkout</button>
  </div>

  <!-- CHECKOUT PAGE -->
  <div id="checkout" class="page">
    <h2>Checkout</h2>
    <p>Dummy checkout page for testing SPA segment transitions.</p>
    <button onclick="alert('Order placed (mock)!')">Place Order</button>
  </div>

  <script>
    let cart = [];

    function navigate(page) {
      window.location.hash = page;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(page).classList.add('active');
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      alert(name + ' added to cart');
      updateCartUI();
    }

    function updateCartUI() {
      const container = document.getElementById('cart-items');
      const totalBox = document.getElementById('total');
      container.innerHTML = '';

      let total = 0;
      cart.forEach(item => {
        total += item.price;
        container.innerHTML += `<div class='cart-item'>${item.name} - $${item.price}</div>`;
      });

      totalBox.innerText = 'Total: $' + total;
    }

    // Load correct page from hash
    window.addEventListener('load', () => {
      const page = window.location.hash.replace('#', '') || 'products';
      navigate(page);
    });

    window.addEventListener('hashchange', () => {
      const page = window.location.hash.replace('#', '') || 'products';
      navigate(page);
    });
  </script>
</body>
</html>
